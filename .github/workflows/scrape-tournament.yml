name: Scrape Ongoing Tournament

# ─────────────────────────────────────────────────────────────
#  WHEN THIS RUNS
# ─────────────────────────────────────────────────────────────
#  1) On a schedule, four times a day.
#  2) Manually, any time, via the "Run workflow" button on the
#     Actions tab (that's what `workflow_dispatch` below enables).
#
#  ⚠ GitHub Actions cron schedules always run in UTC — there's no
#  way to give it a US timezone directly. The four lines below are
#  set for 12:00 AM, 6:00 AM, 12:00 PM, and 6:00 PM US Central Time
#  (Houston), converted to UTC for you (using CDT, UTC-5):
#
#      12:00 AM CDT  ->  05:00 UTC   (cron: "0 5 * * *")
#       6:00 AM CDT  ->  11:00 UTC   (cron: "0 11 * * *")
#      12:00 PM CDT  ->  17:00 UTC   (cron: "0 17 * * *")
#       6:00 PM CDT  ->  23:00 UTC   (cron: "0 23 * * *")
#
#  ┌───────────────────────────────────────────────────────────┐
#  │  TO CHANGE THE SCHEDULE: edit the "cron:" lines below.     │
#  │  Format is: minute hour day month weekday (all in UTC).    │
#  └───────────────────────────────────────────────────────────┘
#
#  ⚠ DST NOTE: Central Time flips between CDT (UTC-5, roughly
#  March–November) and CST (UTC-6, roughly November–March). The
#  cron times above are set for CDT. During CST months these will
#  actually fire an hour earlier Central than intended (e.g. the
#  "12:00 AM" run lands at 11:00 PM the night before). If that
#  matters to you, shift each line by +1 hour UTC ("0 6/12/18/0
#  * * *") for the CST months, or just leave it — either way
#  you're at most an hour off for part of the year.
on:
  schedule:
    - cron: "0 5 * * *"   # 12:00 AM CDT / 11:00 PM CST
    - cron: "0 11 * * *"  # 6:00 AM CDT / 5:00 AM CST
    - cron: "0 17 * * *"  # 12:00 PM CDT / 11:00 AM CST
    - cron: "0 23 * * *"  # 6:00 PM CDT / 5:00 PM CST
  workflow_dispatch:
    inputs:
      tournament_id:
        description: "Force a specific tournament ID (leave blank to auto-detect the 'ongoing' one)"
        required: false
        default: ""
      unattended:
        description: "Skip matches where total rounds can't be auto-detected, instead of prompting"
        type: boolean
        required: false
        default: true

# Needed so the job can commit the updated matches.json back to the repo
permissions:
  contents: write

# Don't let two runs step on each other (e.g. a manual run during a scheduled one)
concurrency:
  group: scrape-tournament
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: |
          ARGS="--tournament-id ${{ github.event.inputs.tournament_id }}"
          if [ -z "${{ github.event.inputs.tournament_id }}" ]; then
            ARGS=""
          fi
          if [ "${{ github.event.inputs.unattended }}" != "false" ]; then
            ARGS="$ARGS --unattended"
          fi
          python tools/scrape_tournament.py $ARGS

      - name: Commit and push updated matches.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update matches.json [skip ci]"
            git push
          fi
