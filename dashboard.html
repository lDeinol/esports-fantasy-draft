<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Apply saved theme before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Team — DraftZone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  </head>
<body>

  <header>
    <a href="home.html" class="logo">Draft<span>Zone</span></a>
    <label class="theme-toggle" title="Toggle light / dark mode">
      <input type="checkbox" id="theme-toggle-input" class="theme-toggle-input" />
      <span class="theme-toggle-track">
        <span class="theme-toggle-icon theme-toggle-icon-moon">🌙</span>
        <span class="theme-toggle-icon theme-toggle-icon-sun">☀️</span>
        <span class="theme-toggle-thumb"></span>
      </span>
    </label>
    <div class="header-divider"></div>
    <nav>
      <a href="home.html"      class="nav-link">Home</a>
      <a href="stats.html"     class="nav-link">Stats</a>
      <a href="matches.html"   class="nav-link">Matches</a>
      <a href="index.html"     class="nav-link">Draft</a>
      <a href="dashboard.html" class="nav-link active">My Team</a>
      <a href="standings.html" class="nav-link">Standings</a>
      <a href="trade.html"     class="nav-link">Trades</a>
    </nav>
  </header>

  <main>
    <div id="content">
      <div class="loading-wrap"><div class="spinner"></div></div>
    </div>
  </main>

  <script type="module">
    import {
      db, ref, get, subscribeLobby,
      ensureAuth, LS, CONFIG, SCORING, initThemeToggle,
      computeRoster, getOwnership
    } from "./app.js";

    initThemeToggle();

    const session = LS.getSession();

    // ── No session → redirect ──────────────────────────
    if (!session) {
      window.location.href = "index.html";
    }

    const { uid: myUid, name: myName, lobbyCode } = session;

    // ── Roster card expand/collapse state (keyed by pickId so a current
    //    pick and a past-but-same-player pick never collide) ──────────
    const expandedPicks = new Set();

    // ── Load data ──────────────────────────────────────
    // Averages stats from a given (already stint-scoped) match history,
    // falling back to seeded stats from players.json if there's none yet.
    // Pass in SCORING.stintMatchHistory's result — never whole-tournament
    // matchHistory — so this always agrees with the points shown next to it.
    function resolveStats(pData, history) {
      const statKeys = ["rating", "kd", "acs", "adr", "kpr"];
      if (history.length > 0) {
        const avg = {};
        statKeys.forEach(key => {
          avg[key] = +(history.reduce((s, h) => s + (h.stats[key] ?? 0), 0) / history.length).toFixed(2);
        });
        return { stats: avg, tracked: true, matchCount: history.length };
      }
      const { cl: _cl, ...baseStats } = pData.stats || {};
      return { stats: baseStats, tracked: false, matchCount: 0 };
    }

    // Renders the expandable match-history block under a roster card —
    // shared by current roster cards and Previously Rostered cards so
    // they look and behave identically.
    function renderMatchHistory(history) {
      return `
        <div class="roster-card-history">
          <div class="expand-title">Match History</div>
          ${history.length === 0
            ? `<div style="color:var(--muted); font-size:0.8rem; padding-bottom:8px;">No completed matches yet.</div>`
            : history.map(h => {
                const isWin = h.match.winner === h.stats.team;
                return `
                  <div class="match-history-row">
                    <div class="mh-left">
                      <div class="mh-match">${h.match.team1} vs ${h.match.team2} <span style="color:var(--muted); font-size:0.72rem;">${h.match.score}</span></div>
                      <div class="mh-result ${isWin ? "win" : "loss"}">${isWin ? "W" : "L"}</div>
                      <div class="mh-date">${new Date(h.match.date + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</div>
                    </div>
                    <div class="mh-right">
                      <div class="mh-stats">
                        <div class="mh-chip">RTG <span>${h.stats.rating}</span></div>
                        <div class="mh-chip">K/D <span>${h.stats.kd}</span></div>
                        <div class="mh-chip">ACS <span>${h.stats.acs}</span></div>
                        <div class="mh-chip">ADR <span>${h.stats.adr}</span></div>
                        <div class="mh-chip">KPR <span>${h.stats.kpr}</span></div>
                      </div>
                      <div class="mh-pts">${h.pts} pts</div>
                    </div>
                  </div>
                `;
              }).join("")}
        </div>`;
    }

    // ── Load data ────────────────────────────────────────
    async function loadData() {
      const [playerData, matchData, tournamentData] = await Promise.all([
        fetch("data/players.json").then(r => r.json()).catch(() => []),
        fetch("data/matches.json").then(r => r.json()).catch(() => []),
        fetch("data/tournaments.json").then(r => r.json()).catch(() => []),
      ]);
      return { playerData, matchData, tournamentData };
    }

    // ── Render ─────────────────────────────────────────
    function render(lobbyData, playerData, matchData, tournamentData) {
      const content = document.getElementById("content");

      if (!lobbyData) {
        content.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-title">No active draft found.</div>
            <p>Create or join a lobby to get started.</p>
            <a href="index.html" class="empty-btn">Go Home</a>
          </div>`;
        return;
      }

      const picks        = lobbyData.picks || {};
      const playerMap    = Object.fromEntries(playerData.map(p => [p.id, p]));
      const format       = lobbyData.format;
      const tournamentId = lobbyData.tournamentId || null;
      const budgets      = lobbyData.budgets || {};
      const spent        = budgets[myUid] || 0;
      const remaining    = CONFIG.AUCTION_BUDGET - spent;

      // Tournament name
      const tournament   = tournamentData.find(t => t.id === tournamentId);
      const tournamentLabel = tournament
        ? `<span style="color:var(--accent); font-family:var(--font-mono); font-size:0.8rem;">📋 ${tournament.name}</span>`
        : `<span style="color:var(--muted); font-size:0.8rem;">No tournament selected</span>`;

      // Enrich this manager's current roster with trade-aware, stint-scoped
      // points — a player only earns points toward this manager's total for
      // matches played while they actually owned them, so a trade never
      // moves points retroactively either direction.
      const roster     = computeRoster({ uid: myUid, picks, matchData, tournamentId, tournamentData });
      const totalScore = roster.totalScore;
      const totalPP    = roster.totalPP;

      const enriched = roster.currentRoster.map(({ pickId, pick, pts, pp }) => {
        const pData     = playerMap[pick.playerId] || {};
        // Every stint of THIS manager's on this pick (almost always just
        // one, but a player traded away and back would have two) — the
        // same window points are computed over, so stats/matchCount/
        // history all agree with the pts shown right next to them.
        const myStints  = getOwnership(pick).filter(s => s.uid === myUid);
        const history   = SCORING.stintMatchHistory(pick.playerId, matchData, tournamentId, myStints);
        const { stats, tracked, matchCount } = resolveStats(pData, history);
        const breakdown = SCORING.breakdown(stats);
        return { ...pick, pickId, pData, stats, pts, pp, breakdown, history, tracked, matchCount };
      });

      // Stat summary across roster
      const avgRating = enriched.length
        ? +(enriched.reduce((s, p) => s + (p.stats.rating || 0), 0) / enriched.length).toFixed(2)
        : 0;
      const avgKD = enriched.length
        ? +(enriched.reduce((s, p) => s + (p.stats.kd || 0), 0) / enriched.length).toFixed(2)
        : 0;

      // Same stint-scoped treatment for traded-away players, so clicking
      // one shows exactly the matches that earned points while they were
      // on THIS manager's roster (not their whole-tournament history).
      const enrichedPast = roster.pastPlayers.map(({ pickId, pick, pts, pp, total }) => {
        const myStints = getOwnership(pick).filter(s => s.uid === myUid);
        const history  = SCORING.stintMatchHistory(pick.playerId, matchData, tournamentId, myStints);
        return { ...pick, pickId, pts, pp, total, history };
      });

      const statusBadge = lobbyData.status === "complete"
        ? `<span style="color:var(--success); font-size:0.8rem; font-weight:600;">✓ Draft Complete</span>`
        : `<span style="color:var(--warn); font-size:0.8rem; font-weight:600;">⏳ Draft In Progress</span>`;

      content.innerHTML = `
        <div class="page-title">${myName}'s Team</div>
        <div class="page-sub">Lobby <span style="font-family:var(--font-mono); color:var(--accent);">${lobbyCode}</span> · ${statusBadge} · ${tournamentLabel}</div>

        <div class="score-hero">
          <div class="score-main">
            <div class="score-label">Total Fantasy Score</div>
            <div class="score-value">${totalScore}</div>
            <div class="score-meta">${enriched.length} / ${CONFIG.ROSTER_SIZE} picks made</div>
          </div>
          <div class="score-breakdown">
            <div class="score-stat">
              <div class="score-stat-val">${avgRating}</div>
              <div class="score-stat-label">Avg Rating</div>
            </div>
            <div class="score-stat">
              <div class="score-stat-val">${avgKD}</div>
              <div class="score-stat-label">Avg K/D</div>
            </div>
            <div class="score-stat">
              <div class="score-stat-val">${enriched.length}</div>
              <div class="score-stat-label">Players</div>
            </div>
            ${totalPP > 0 ? `
            <div class="score-stat">
              <div class="score-stat-val" style="color:var(--success);">+${totalPP}</div>
              <div class="score-stat-label">Placement Pts</div>
            </div>` : ""}
          </div>
        </div>

        ${format === "auction" ? `
        <div class="budget-section show">
          <div class="budget-row">
            <span class="budget-label-text">Auction Budget</span>
            <span class="budget-numbers">
              <span class="budget-spent">$${spent} spent</span>
              <span style="color:var(--muted);"> · </span>
              <span class="budget-left">$${remaining} left</span>
            </span>
          </div>
          <div class="budget-track">
            <div class="budget-fill" style="width:${Math.max(0, (remaining / CONFIG.AUCTION_BUDGET) * 100)}%; background:${remaining < 50 ? 'var(--danger)' : remaining < 100 ? 'var(--warn)' : 'var(--success)'};"></div>
          </div>
        </div>` : ""}

        <div class="info-row">
          <div class="info-pill">Format: <strong>${format === "auction" ? "🏷 Auction" : "🐍 Snake"}</strong></div>
          <div class="info-pill">Roster size: <strong>${CONFIG.ROSTER_SIZE} picks</strong></div>
          <a href="standings.html" style="text-decoration:none;">
            <div class="info-pill" style="cursor:pointer; border-color:var(--accent); color:var(--accent);">View Standings →</div>
          </a>
          <a href="trade.html" style="text-decoration:none;">
            <div class="info-pill" style="cursor:pointer; border-color:var(--accent2); color:var(--accent2);">Trades →</div>
          </a>
        </div>

        <div class="section-title">Roster</div>

        <div class="roster-grid">
          ${enriched.length === 0 ? `
            <div class="empty-state">
              <div class="empty-state-title">No picks yet</div>
              <p>Head back to the draft room to make your picks.</p>
              <a href="draft.html?code=${lobbyCode}" class="empty-btn">Go to Draft</a>
            </div>
          ` : enriched.map((p, i) => `
            <div class="roster-card-wrap">
              <div class="roster-card" data-pick-id="${p.pickId}" style="cursor:pointer;">
                <div class="pick-num">${p.label || `${p.round}.${p.pick}`}</div>
                <div class="player-info">
                  <div class="player-name">${p.playerName}</div>
                  <div class="player-meta">
                    ${p.pData.team || p.playerTeam || "—"} ·
                    ${p.pData.role || p.playerRole || "—"} ·
                    ${p.pData.region || "—"}
                    ${p.skipped ? ' · <span class="skipped-badge">Auto-pick</span>' : ""}
                    ${p.price    ? ` · <span class="price-badge">$${p.price}</span>` : ""}
                    · ${p.tracked
                      ? `<span style="font-size:0.65rem; color:var(--success); font-weight:700;">●Tracked (${p.matchCount})</span>`
                      : `<span style="font-size:0.65rem; color:var(--muted); font-weight:700;">Seeded</span>`}
                  </div>
                </div>
                <div class="stat-chips">
                  ${p.breakdown.map(b => `
                    <div class="stat-chip">
                      <div class="stat-chip-val">${b.stat === 'CL' ? `${b.value}%` : b.value}</div>
                      <div class="stat-chip-label">${b.stat}</div>
                    </div>
                  `).join("")}
                </div>
                <div class="player-pts">
                  <div class="player-pts-val">${p.pts}</div>
                  <div class="player-pts-label">pts</div>
                  ${p.pp > 0 ? `<div class="player-pts-pp">+${p.pp} PP</div>` : ""}
                </div>
              </div>
              ${expandedPicks.has(p.pickId) ? renderMatchHistory(p.history) : ""}
            </div>
          `).join("")}
        </div>

        ${roster.pastPlayers.length > 0 ? `
        <div class="section-title" style="margin-top:28px;">Previously Rostered</div>
        <div class="page-sub" style="margin-top:-14px;">Players you've traded away — you keep the points they scored while they were on your team. Click one to see those matches.</div>
        <div class="roster-grid">
          ${enrichedPast.map(p => `
            <div class="roster-card-wrap">
              <div class="roster-card" data-pick-id="${p.pickId}" style="opacity:0.6; cursor:pointer;">
                <div class="pick-num">Traded</div>
                <div class="player-info">
                  <div class="player-name">${p.playerName}</div>
                  <div class="player-meta">${p.playerTeam || "—"} · ${p.playerRole || "—"}</div>
                </div>
                <div class="player-pts">
                  <div class="player-pts-val">${p.total}</div>
                  <div class="player-pts-label">pts earned</div>
                </div>
              </div>
              ${expandedPicks.has(p.pickId) ? renderMatchHistory(p.history) : ""}
            </div>
          `).join("")}
        </div>` : ""}
      `;

      // Click a roster card (current or previously-rostered) to
      // expand/collapse its match history
      content.querySelectorAll(".roster-card").forEach(card => {
        card.addEventListener("click", () => {
          const id = card.dataset.pickId;
          expandedPicks.has(id) ? expandedPicks.delete(id) : expandedPicks.add(id);
          render(lobbyData, playerData, matchData, tournamentData);
        });
      });
    }

    // ── Init ───────────────────────────────────────────
    async function init() {
      await ensureAuth();
      const { playerData, matchData, tournamentData } = await loadData();

      subscribeLobby(lobbyCode, (lobbyData) => {
        render(lobbyData, playerData, matchData, tournamentData);
      });
    }

    init();
  </script>

</body>
</html>
